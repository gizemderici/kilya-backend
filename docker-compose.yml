services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kilya
      POSTGRES_PASSWORD: kilya
      POSTGRES_DB: kilya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilya -d kilya"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: kilya
      POSTGRES_PASSWORD: kilya
      POSTGRES_DB: kilya_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
